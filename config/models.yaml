# Fast routing — Gemini first when GEMINI_API_KEY is set
# Keeps free OpenRouter models as short fallback only

taskrouting:
  chat:
    primary: "gemini-3.8-flash"
    fallbacks:
      - "gemini-3.6-flash"
      - "gemini-3.5-flash-lite"
      - "openrouter/free"
      - "google/gemma-4-26b-a4b-it:free"
    params:
      maxtokens: 700
      temperature: 0.3
  analysis:
    primary: "gemini-3.8-flash"
    fallbacks:
      - "gemini-3.6-flash"
      - "openrouter/free"
      - "google/gemma-4-26b-a4b-it:free"
    params:
      maxtokens: 800
      temperature: 0.2
  code:
    primary: "gemini-3.8-flash"
    fallbacks:
      - "gemini-3.6-flash"
      - "openrouter/free"
    params:
      maxtokens: 900
      temperature: 0.1
  math:
    primary: "gemini-3.8-flash"
    fallbacks:
      - "gemini-3.6-flash"
      - "openrouter/free"
    params:
      maxtokens: 600
      temperature: 0
  creative:
    primary: "gemini-3.8-flash"
    fallbacks:
      - "gemini-3.6-flash"
      - "openrouter/free"
    params:
      maxtokens: 700
      temperature: 0.7
  vision:
    primary: "gemini-3.8-flash"
    fallbacks:
      - "gemini-3.6-flash"
      - "gemini-3.5-flash-lite"
      - "google/gemini-2.0-flash-exp:free"
    params:
      maxtokens: 900
      temperature: 0.2

providers:
  openai:
    apikeyenv: "OPENAI_API_KEY"
    baseurl: "https://api.openai.com/v1"
    models: ["gpt-4o", "gpt-4o-mini", "text-embedding-3-small", "dall-e-3"]
  anthropic:
    apikeyenv: "ANTHROPIC_API_KEY"
    baseurl: "https://api.anthropic.com/v1"
    models: ["claude-sonnet-4.5", "claude-3-5-sonnet-20241022"]
  openrouter:
    apikeyenv: "OPENROUTER_API_KEY"
    baseurl: "https://openrouter.ai/api/v1"
    models: ["*"]
  google:
    apikeyenv: "GEMINI_API_KEY"
    baseurl: "https://generativelanguage.googleapis.com/v1beta"
    models: ["*"]
