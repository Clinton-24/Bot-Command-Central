# Free-only routing — avoids OpenRouter 402 (no credits / max_tokens)
# Live free IDs checked 2026-10-16. Paid models only as last resort if key has balance.

taskrouting:
  chat:
    primary: "openrouter/free"
    fallbacks:
      - "google/gemma-4-26b-a4b-it:free"
      - "google/gemma-4-31b-it:free"
      - "liquid/lfm-2.5-2.6b:free"
      - "nvidia/nemotron-3-super-120b-a12b:free"
      - "nvidia/nemotron-3-ultra-550b-a55b:free"
      - "thinkingmachines/inkling:free"
      - "poolside/laguna-s-2.1:free"
    params:
      maxtokens: 512
      temperature: 0.3
  analysis:
    primary: "google/gemma-4-26b-a4b-it:free"
    fallbacks:
      - "openrouter/free"
      - "google/gemma-4-31b-it:free"
      - "nvidia/nemotron-3-super-120b-a12b:free"
    params:
      maxtokens: 800
      temperature: 0.1
  code:
    primary: "cohere/north-mini-code:free"
    fallbacks:
      - "google/gemma-4-26b-a4b-it:free"
      - "openrouter/free"
    params:
      maxtokens: 1024
      temperature: 0.0
  math:
    primary: "google/gemma-4-26b-a4b-it:free"
    fallbacks:
      - "openrouter/free"
      - "nvidia/nemotron-3-super-120b-a12b:free"
    params:
      maxtokens: 512
      temperature: 0.0
  creative:
    primary: "openrouter/free"
    fallbacks:
      - "google/gemma-4-31b-it:free"
      - "liquid/lfm-2.5-2.6b:free"
    params:
      maxtokens: 600
      temperature: 0.7
  vision:
    primary: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
    fallbacks:
      - "nvidia/nemotron-3.5-super-vl:free"
      - "google/gemma-4-26b-a4b-it:free"
      - "openrouter/free"
    params:
      maxtokens: 600
      temperature: 0.2

providers:
  openai:
    apikeyenv: "OPENAI_API_KEY"
    baseurl: "https://api.openai.com/v1"
    models: ["gpt-4o", "gpt-4o-mini", "text-embedding-3-small", "dall-e-3"]
  anthropic:
    apikeyenv: "ANTHROPIC_API_KEY"
    baseurl: "https://api.anthropic.com/v1"
    models: ["claude-sonnet-4.5", "claude-3-5-sonnet-20241022"]
  openrouter:
    apikeyenv: "OPENROUTER_API_KEY"
    baseurl: "https://openrouter.ai/api/v1"
    models: ["*"]

defaults:
  timeoutseconds: 30
  maxretries: 1
  retrybackoffbase: 1.2
  embedmodel: "text-embedding-3-small"
  embeddim: 1536
