# Fast routing — 1–2 Gemini Flash models only
# Override primary with CRESCENT_CHAT_MODEL on Render if needed

taskrouting:
  chat:
    primary: "gemini-2.5-flash"
    fallbacks:
      - "gemini-2.0-flash"
    params:
      maxtokens: 600
      temperature: 0.3
  analysis:
    primary: "gemini-2.5-flash"
    fallbacks:
      - "gemini-2.0-flash"
    params:
      maxtokens: 700
      temperature: 0.2
  code:
    primary: "gemini-2.5-flash"
    fallbacks:
      - "gemini-2.0-flash"
    params:
      maxtokens: 800
      temperature: 0.1
  math:
    primary: "gemini-2.5-flash"
    fallbacks:
      - "gemini-2.0-flash"
    params:
      maxtokens: 500
      temperature: 0
  creative:
    primary: "gemini-2.5-flash"
    fallbacks:
      - "gemini-2.0-flash"
    params:
      maxtokens: 600
      temperature: 0.7
  vision:
    primary: "gemini-2.5-flash"
    fallbacks:
      - "gemini-2.0-flash"
    params:
      maxtokens: 700
      temperature: 0.2

providers:
  openai:
    apikeyenv: "OPENAI_API_KEY"
    baseurl: "https://api.openai.com/v1"
    models: ["gpt-4o", "gpt-4o-mini", "text-embedding-3-small", "dall-e-3"]
  anthropic:
    apikeyenv: "ANTHROPIC_API_KEY"
    baseurl: "https://api.anthropic.com/v1"
    models: ["claude-sonnet-4.5", "claude-3-5-sonnet-20241022"]
  openrouter:
    apikeyenv: "OPENROUTER_API_KEY"
    baseurl: "https://openrouter.ai/api/v1"
    models: ["*"]
  google:
    apikeyenv: "GEMINI_API_KEY"
    baseurl: "https://generativelanguage.googleapis.com/v1beta"
    models: ["*"]
