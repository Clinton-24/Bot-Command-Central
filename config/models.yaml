taskrouting:
  chat:
    primary: "gpt-4o-mini"
    fallbacks: ["gpt-4o", "claude-3-5-sonnet-20241022"]
    params:
      maxtokens: 2000
      temperature: 0.3
  analysis:
    primary: "gpt-4o"
    fallbacks: ["claude-3-5-sonnet-20241022"]
    params:
      maxtokens: 4000
      temperature: 0.1
  code:
    primary: "claude-3-5-sonnet-20241022"
    fallbacks: ["gpt-4o"]
    params:
      maxtokens: 8000
      temperature: 0.0
  math:
    primary: "gpt-4o"
    fallbacks: ["claude-3-5-sonnet-20241022"]
    params:
      maxtokens: 2000
      temperature: 0.0
  creative:
    primary: "claude-3-5-sonnet-20241022"
    fallbacks: ["gpt-4o"]
    params:
      maxtokens: 4000
      temperature: 0.7
  vision:
    primary: "gpt-4o"
    fallbacks: ["claude-3-5-sonnet-20241022"]
    params:
      maxtokens: 2000
      temperature: 0.2

providers:
  openai:
    apikeyenv: "OPENAI_API_KEY"
    baseurl: "https://api.openai.com/v1"
    models: ["gpt-4o", "gpt-4o-mini", "text-embedding-3-small"]
  anthropic:
    apikeyenv: "ANTHROPIC_API_KEY"
    baseurl: "https://api.anthropic.com/v1"
    models: ["claude-3-5-sonnet-20241022"]
  openrouter:
    apikeyenv: "OPENROUTER_API_KEY"
    baseurl: "https://openrouter.ai/api/v1"
    models: ["*"]

defaults:
  timeoutseconds: 30
  maxretries: 2
  retrybackoffbase: 1.5
  embedmodel: "text-embedding-3-small"
  embeddim: 1536
