# Free-only routing — avoids OpenRouter 402 (no credits / max_tokens)
# Vision prefers Google Gemini (native multimodal). Live IDs checked 2026-10-19.

taskrouting:
  chat:
    primary: "openrouter/free"
    fallbacks:
      - "google/gemma-4-26b-a4b-it:free"
      - "google/gemma-4-31b-it:free"
      - "liquid/lfm-2.5-2.6b:free"
      - "nvidia/nemotron-3-super-120b-a12b:free"
      - "nvidia/nemotron-3-ultra-550b-a55b:free"
      - "thinkingmachines/inkling:free"
      - "poolside/laguna-s-2.1:free"
    params:
      maxtokens: 512
      temperature: 0.3
  analysis:
    primary: "google/gemma-4-26b-a4b-it:free"
    fallbacks:
      - "openrouter/free"
      - "nvidia/nemotron-3-super-120b-a12b:free"
    params:
      maxtokens: 800
      temperature: 0.2
  code:
    primary: "openrouter/free"
    fallbacks:
      - "google/gemma-4-26b-a4b-it:free"
      - "nvidia/nemotron-3-super-120b-a12b:free"
    params:
      maxtokens: 900
      temperature: 0.1
  math:
    primary: "openrouter/free"
    fallbacks:
      - "google/gemma-4-26b-a4b-it:free"
    params:
      maxtokens: 600
      temperature: 0
  creative:
    primary: "openrouter/free"
    fallbacks:
      - "google/gemma-4-26b-a4b-it:free"
    params:
      maxtokens: 700
      temperature: 0.7
  vision:
    primary: "gemini-3.8-flash"
    fallbacks:
      - "gemini-2.5-flash"
      - "gemini-2.0-flash"
      - "google/gemini-2.0-flash-exp:free"
      - "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
    params:
      maxtokens: 1200
      temperature: 0.2

providers:
  openai:
    apikeyenv: "OPENAI_API_KEY"
    baseurl: "https://api.openai.com/v1"
    models: ["gpt-4o", "gpt-4o-mini", "text-embedding-3-small", "dall-e-3"]
  anthropic:
    apikeyenv: "ANTHROPIC_API_KEY"
    baseurl: "https://api.anthropic.com/v1"
    models: ["claude-sonnet-4.5", "claude-3-5-sonnet-20241022"]
  openrouter:
    apikeyenv: "OPENROUTER_API_KEY"
    baseurl: "https://openrouter.ai/api/v1"
    models: ["*"]
  google:
    apikeyenv: "GEMINI_API_KEY"
    baseurl: "https://generativelanguage.googleapis.com/v1beta"
    models: ["*"]
