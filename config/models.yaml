# Live free models on OpenRouter as of 2026-10-15
# Dead IDs (removed from catalog): google/gemma-2-9b-it:free, meta-llama/llama-3.2-3b-instruct:free
# openrouter/free = auto-router that picks any available free model
# gpt-4o-mini needs OpenRouter credits OR OPENAI_API_KEY

taskrouting:
  chat:
    primary: "openrouter/free"
    fallbacks:
      - "google/gemma-4-26b-a4b-it:free"
      - "google/gemma-4-31b-it:free"
      - "liquid/lfm-2.5-2.6b:free"
      - "nvidia/nemotron-3-super-120b-a12b:free"
      - "openai/gpt-4o-mini"
    params:
      maxtokens: 1200
      temperature: 0.3
  analysis:
    primary: "google/gemma-4-26b-a4b-it:free"
    fallbacks:
      - "openrouter/free"
      - "nvidia/nemotron-3-super-120b-a12b:free"
      - "openai/gpt-4o-mini"
    params:
      maxtokens: 2500
      temperature: 0.1
  code:
    primary: "cohere/north-mini-code:free"
    fallbacks:
      - "google/gemma-4-26b-a4b-it:free"
      - "openrouter/free"
      - "openai/gpt-4o-mini"
    params:
      maxtokens: 4000
      temperature: 0.0
  math:
    primary: "google/gemma-4-26b-a4b-it:free"
    fallbacks:
      - "openrouter/free"
      - "openai/gpt-4o-mini"
    params:
      maxtokens: 1500
      temperature: 0.0
  creative:
    primary: "openrouter/free"
    fallbacks:
      - "google/gemma-4-31b-it:free"
      - "openai/gpt-4o-mini"
    params:
      maxtokens: 2000
      temperature: 0.7
  vision:
    primary: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
    fallbacks:
      - "google/gemma-4-26b-a4b-it:free"
      - "openai/gpt-4o-mini"
      - "openai/gpt-4o"
    params:
      maxtokens: 2000
      temperature: 0.2

providers:
  openai:
    apikeyenv: "OPENAI_API_KEY"
    baseurl: "https://api.openai.com/v1"
    models: ["gpt-4o", "gpt-4o-mini", "text-embedding-3-small", "dall-e-3"]
  anthropic:
    apikeyenv: "ANTHROPIC_API_KEY"
    baseurl: "https://api.anthropic.com/v1"
    models: ["claude-sonnet-4.5", "claude-3-5-sonnet-20241022"]
  openrouter:
    apikeyenv: "OPENROUTER_API_KEY"
    baseurl: "https://openrouter.ai/api/v1"
    models: ["*"]

defaults:
  timeoutseconds: 45
  maxretries: 1
  retrybackoffbase: 1.2
  embedmodel: "text-embedding-3-small"
  embeddim: 1536
